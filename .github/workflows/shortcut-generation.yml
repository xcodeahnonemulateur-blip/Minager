name: Shortcut Generation (unsigned)
on:
  workflow_dispatch:
  push:
    branches:
      - shortcut-generation
    paths:
      - "shortcut-generation/**"
      - ".github/workflows/shortcut-generation.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test du mini-langage et du nouvel assembleur
        run: python -m unittest discover -s shortcut-generation/tests -v
      - name: Générer les exemples et la recette avancée (non signés)
        run: |
          python shortcut-generation/compile.py shortcut-generation/examples/bonjour.sgen -o output/bonjour.unsigned.shortcut
          python shortcut-generation/compile.py shortcut-generation/examples/alerte.sgen -o output/alerte.unsigned.shortcut
          python shortcut-generation/assemble.py shortcut-generation/examples/centre-iphone.json -o output/centre-iphone.unsigned.shortcut
      - name: Artefacts GitHub (NON signés)
        uses: actions/upload-artifact@v4
        with:
          name: shortcuts-unsigned
          path: output/*.shortcut
