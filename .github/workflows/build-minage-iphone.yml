name: Minage iPhone - IPA (non signée)
on:
  workflow_dispatch:
  push:
    paths:
      - 'Minage-iPhone/**'
      - '.github/workflows/build-minage-iphone.yml'
permissions:
  contents: read
jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: |
          cd Minage-iPhone
          xcodegen generate
      - name: Compiler pour iPhone physique
        run: |
          cd Minage-iPhone
          xcodebuild -project MinageiPhone.xcodeproj -scheme MinageiPhone -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Créer IPA non signée
        run: |
          cd Minage-iPhone
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MinageiPhone.app Payload/
          zip -qry ../Minage-iPhone-unsigned.ipa Payload
      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minage-iPhone-unsigned
          path: Minage-iPhone-unsigned.ipa
          retention-days: 7
